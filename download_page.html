<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل ملف Devices TikTok</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        .info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }
        .download-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
        }
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        .stat {
            text-align: center;
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 ملف Devices TikTok</h1>
        
        <div class="info">
            <h3>معلومات الملف:</h3>
            <p>يحتوي على 300 زوج من device_id و install_id</p>
            <p>صيغة الملف: device_id:install_id</p>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-number">300</div>
                <div class="stat-label">عدد الأجهزة</div>
            </div>
            <div class="stat">
                <div class="stat-number">12KB</div>
                <div class="stat-label">حجم الملف</div>
            </div>
        </div>
        
        <a href="devices.txt" download class="download-btn">
            ⬇️ تحميل الملف
        </a>
        
        <div class="info">
            <h4>مثال من الملف:</h4>
            <code style="background: #e9ecef; padding: 5px; border-radius: 5px;">
                7531135130632914439:7531135417245517575
            </code>
        </div>
    </div>
</body>
</html>
